models:
  - name: dim_produtos
    description: Dimensão de produto
    columns:
      - name: productid
        description: Id do produto
        tests:
          - not_null
          - unique
      - name: productnumber
        description: Referencia de fabrica do produto
        tests:
          - not_null
          - unique
      - name: dsc_produto
        description: Descrição detalhada do produto
        tests:
          - not_null
      - name: safetystocklevel
        description: Quantidade do estoque minimo do produto